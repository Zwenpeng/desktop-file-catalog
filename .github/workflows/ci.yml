name: Windows build and integration test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Integration test
        run: dotnet run --project .\tests\DesktopCatalogApp.IntegrationTests\DesktopCatalogApp.IntegrationTests.csproj -c Release
      - name: Publish portable Windows x64 app
        run: dotnet publish .\src\DesktopCatalogApp\DesktopCatalogApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o .\artifacts\publish
      - name: Check published EXE
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '.\artifacts\publish\桌面文件管家.exe')) {
            throw 'Portable EXE was not created.'
          }
